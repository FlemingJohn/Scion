<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="608" viewBox="0 0 1280 608" role="img" aria-labelledby="title description">
  <title id="title">Two commits racing for one branch</title>
  <desc id="description">Agent A moves main from c1 to a2 and succeeds. Agent B then tries to move main from c1 to b2 and gets a conflict because main is now at a2.</desc>
  <defs>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#9C9A92" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1280" height="608" fill="#141413"/>
  <rect x="16" y="16" width="1248" height="576" rx="24" fill="#1F1E1D"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="64" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#F5F4ED">Two commits racing for one branch</text>
    <text x="64" y="102" font-size="15" fill="#9C9A92">Moving a branch is one compare and swap on one row. No lock. Whoever arrives second is told the branch moved.</text>
    
    <line x1="150" y1="196" x2="150" y2="552" stroke="#3D3D3A" stroke-width="2"/>
    <line x1="640" y1="196" x2="640" y2="552" stroke="#3D3D3A" stroke-width="2"/>
    <line x1="1130" y1="196" x2="1130" y2="552" stroke="#3D3D3A" stroke-width="2"/>
    <rect x="60" y="140" width="180" height="56" rx="10" fill="#2A2926" stroke="#9C9A92" stroke-width="2"/>
    <text x="150" y="174" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" text-anchor="middle" fill="#F5F4ED">Agent A</text>
    <rect x="550" y="140" width="180" height="56" rx="10" fill="#1C2836" stroke="#6A9BD8" stroke-width="2"/>
    <text x="640" y="174" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" text-anchor="middle" fill="#F5F4ED">scion-server</text>
    <rect x="1040" y="140" width="180" height="56" rx="10" fill="#2A2926" stroke="#9C9A92" stroke-width="2"/>
    <text x="1130" y="174" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" text-anchor="middle" fill="#F5F4ED">Agent B</text>
    <rect x="40" y="222" width="1200" height="40" rx="8" fill="#3A2A23" stroke="#E08A6D" stroke-width="1.5"/>
    <text x="640" y="247" font-size="14" text-anchor="middle" fill="#F5E6DD">both checked out main at c1</text>
    <path d="M150 302 H634" fill="none" stroke="#9C9A92" stroke-width="2" marker-end="url(#arrow-muted)"/>
    <text x="395" y="291" font-size="14" text-anchor="middle" fill="#F5F4ED" stroke="#1F1E1D" stroke-width="6" stroke-linejoin="round" paint-order="stroke">move main from c1 to a2</text>
    <path d="M640 354 H156" fill="none" stroke="#9C9A92" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-muted)"/>
    <text x="395" y="343" font-size="14" text-anchor="middle" fill="#F5F4ED" stroke="#1F1E1D" stroke-width="6" stroke-linejoin="round" paint-order="stroke">moved</text>
    <path d="M1130 406 H646" fill="none" stroke="#9C9A92" stroke-width="2" marker-end="url(#arrow-muted)"/>
    <text x="885" y="395" font-size="14" text-anchor="middle" fill="#F5F4ED" stroke="#1F1E1D" stroke-width="6" stroke-linejoin="round" paint-order="stroke">move main from c1 to b2</text>
    <path d="M640 458 H1124" fill="none" stroke="#9C9A92" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-muted)"/>
    <text x="885" y="447" font-size="14" text-anchor="middle" fill="#F5F4ED" stroke="#1F1E1D" stroke-width="6" stroke-linejoin="round" paint-order="stroke">conflict, main is at a2 now</text>
    <rect x="1020" y="488" width="220" height="40" rx="8" fill="#3A2A23" stroke="#E08A6D" stroke-width="1.5"/>
    <text x="1130" y="513" font-size="14" text-anchor="middle" fill="#F5E6DD">b2 is saved, but not on main</text>
  </g>
</svg>
