<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1252" viewBox="0 0 1280 1252" role="img" aria-labelledby="title description">
  <title id="title">What happens on checkout</title>
  <desc id="description">The client asks the server where main points, gets folder listings from the cache, which asks the server on a miss, then gets each blob from local disk or the cache.</desc>
  <defs>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#9C9A92" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1280" height="1252" fill="#141413"/>
  <rect x="16" y="16" width="1248" height="1220" rx="24" fill="#1F1E1D"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="64" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#F5F4ED">What happens on checkout</text>
    <text x="64" y="102" font-size="15" fill="#9C9A92">Only the folders you ask for. Every blob is checked against its hash before it is written.</text>
    <rect x="80" y="382" width="1120" height="308" rx="8" fill="#E08A6D" fill-opacity="0.05" stroke="#E08A6D" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="80" y="382" width="56" height="26" rx="6" fill="#3A2A23" stroke="#E08A6D" stroke-width="1.5"/>
    <text x="108" y="400" font-size="13" font-weight="600" text-anchor="middle" fill="#F5E6DD">alt</text>
    <text x="150" y="400" font-size="13" fill="#D6D4CB">cache hit</text>
    <line x1="80" y1="478" x2="1200" y2="478" stroke="#E08A6D" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="150" y="496" font-size="13" fill="#D6D4CB">cache miss</text>
    <rect x="94" y="794" width="765.3333333333334" height="308" rx="8" fill="#E08A6D" fill-opacity="0.05" stroke="#E08A6D" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="94" y="794" width="56" height="26" rx="6" fill="#3A2A23" stroke="#E08A6D" stroke-width="1.5"/>
    <text x="122" y="812" font-size="13" font-weight="600" text-anchor="middle" fill="#F5E6DD">alt</text>
    <text x="164" y="812" font-size="13" fill="#D6D4CB">on disk</text>
    <line x1="94" y1="890" x2="859.3333333333334" y2="890" stroke="#E08A6D" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="164" y="908" font-size="13" fill="#D6D4CB">not on disk</text>
    <rect x="80" y="702" width="793.3333333333334" height="422" rx="8" fill="#E08A6D" fill-opacity="0.05" stroke="#E08A6D" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="80" y="702" width="56" height="26" rx="6" fill="#3A2A23" stroke="#E08A6D" stroke-width="1.5"/>
    <text x="108" y="720" font-size="13" font-weight="600" text-anchor="middle" fill="#F5E6DD">loop</text>
    <text x="150" y="720" font-size="13" fill="#D6D4CB">each file in the tree</text>
    <line x1="150" y1="196" x2="150" y2="1196" stroke="#3D3D3A" stroke-width="2"/>
    <line x1="476.6666666666667" y1="196" x2="476.6666666666667" y2="1196" stroke="#3D3D3A" stroke-width="2"/>
