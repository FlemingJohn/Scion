    <circle cx="1130" cy="296" r="11" fill="#E08A6D"/>
    <text x="1130" y="300" font-size="11" font-weight="700" text-anchor="middle" fill="#1F1E1D">2</text>
    <path d="M150 348 H797.3333333333334" fill="none" stroke="#9C9A92" stroke-width="2" marker-end="url(#arrow-muted)"/>
