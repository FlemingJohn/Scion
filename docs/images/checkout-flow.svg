    <circle cx="1130" cy="594" r="11" fill="#E08A6D"/>
    <text x="1130" y="598" font-size="11" font-weight="700" text-anchor="middle" fill="#1F1E1D">6</text>
    <path d="M803.3333333333334 646 H156" fill="none" stroke="#9C9A92" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-muted)"/>
    <text x="476.6666666666667" y="635" font-size="14" text-anchor="middle" fill="#F5F4ED" stroke="#1F1E1D" stroke-width="6" stroke-linejoin="round" paint-order="stroke">tree, now kept in memory</text>
    <circle cx="803.3333333333334" cy="646" r="11" fill="#E08A6D"/>
    <text x="803.3333333333334" y="650" font-size="11" font-weight="700" text-anchor="middle" fill="#1F1E1D">7</text>
    <path d="M150 760 H470.6666666666667" fill="none" stroke="#9C9A92" stroke-width="2" marker-end="url(#arrow-muted)"/>
