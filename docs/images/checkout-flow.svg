    <text x="313.33333333333337" y="1047" font-size="14" text-anchor="middle" fill="#F5F4ED" stroke="#1F1E1D" stroke-width="6" stroke-linejoin="round" paint-order="stroke">check the hash, then keep it</text>
    <circle cx="150" cy="1058" r="11" fill="#E08A6D"/>
    <text x="150" y="1062" font-size="11" font-weight="700" text-anchor="middle" fill="#1F1E1D">12</text>
    <rect x="40" y="1132" width="546.6666666666667" height="40" rx="8" fill="#3A2A23" stroke="#E08A6D" stroke-width="1.5"/>
    <text x="313.33333333333337" y="1157" font-size="14" text-anchor="middle" fill="#F5E6DD">files written, checkout state saved in .scion/</text>
  </g>
</svg>
