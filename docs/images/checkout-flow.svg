    <line x1="1130" y1="196" x2="1130" y2="1196" stroke="#3D3D3A" stroke-width="2"/>
    <rect x="60" y="140" width="180" height="56" rx="10" fill="#2A2926" stroke="#9C9A92" stroke-width="2"/>
    <text x="150" y="174" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" text-anchor="middle" fill="#F5F4ED">scion</text>
    <rect x="386.6666666666667" y="140" width="180" height="56" rx="10" fill="#2A2926" stroke="#9C9A92" stroke-width="2"/>
    <text x="476.6666666666667" y="174" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" text-anchor="middle" fill="#F5F4ED">Local disk</text>
