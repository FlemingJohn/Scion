    <circle cx="150" cy="954" r="11" fill="#E08A6D"/>
    <text x="150" y="958" font-size="11" font-weight="700" text-anchor="middle" fill="#1F1E1D">10</text>
    <path d="M803.3333333333334 1006 H156" fill="none" stroke="#9C9A92" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-muted)"/>
    <text x="476.6666666666667" y="995" font-size="14" text-anchor="middle" fill="#F5F4ED" stroke="#1F1E1D" stroke-width="6" stroke-linejoin="round" paint-order="stroke">contents</text>
    <circle cx="803.3333333333334" cy="1006" r="11" fill="#E08A6D"/>
