<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title description">
  <title id="title">Scion</title>
  <desc id="description">History lives on the server. Clients fetch only what they need.</desc>
  <defs>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#E08A6D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#9C9A92" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1280" height="320" fill="#141413"/>
  <rect x="16" y="16" width="1248" height="288" rx="24" fill="#1F1E1D"/>

  <text x="72" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" letter-spacing="2.4" fill="#E08A6D">SOURCE CONTROL FOR AGENTS</text>
  <text x="68" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="84" fill="#F5F4ED">Scion</text>
  <text x="72" y="222" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#D6D4CB">History lives on the server.</text>
  <text x="72" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#D6D4CB">Clients fetch only what they need.</text>
  <text x="72" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#9C9A92">TypeScript · Fastify · Supabase Postgres · MinIO</text>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="895" y="50" font-size="13" text-anchor="middle" fill="#9C9A92">commit · branches · history</text>
    <path d="M695 96 V62 H1095 V92" fill="none" stroke="#9C9A92" stroke-width="2" marker-end="url(#arrow-muted)"/>

    <rect x="620" y="96" width="150" height="56" rx="10" fill="#2A2926" stroke="#9C9A92" stroke-width="2"/>
    <text x="695" y="122" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" text-anchor="middle" fill="#F5F4ED">scion</text>
    <text x="695" y="141" font-size="12" text-anchor="middle" fill="#9C9A92">your machine</text>

    <path d="M770 124 H814" fill="none" stroke="#E08A6D" stroke-width="2" marker-end="url(#arrow-accent)"/>

    <rect x="820" y="96" width="150" height="56" rx="10" fill="#1C2836" stroke="#6A9BD8" stroke-width="2"/>
    <text x="895" y="122" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" text-anchor="middle" fill="#F5F4ED">scion-cache</text>
    <text x="895" y="141" font-size="12" text-anchor="middle" fill="#9C9A92">in memory</text>

    <path d="M970 124 H1014" fill="none" stroke="#E08A6D" stroke-width="2" marker-end="url(#arrow-accent)"/>

    <rect x="1020" y="96" width="150" height="56" rx="10" fill="#1C2836" stroke="#6A9BD8" stroke-width="2"/>
    <text x="1095" y="122" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" text-anchor="middle" fill="#F5F4ED">scion-server</text>
    <text x="1095" y="141" font-size="12" text-anchor="middle" fill="#9C9A92">owns history</text>

    <text x="820" y="180" font-size="13" text-anchor="middle" fill="#E08A6D">trees and blobs</text>
    <text x="992" y="180" font-size="13" text-anchor="middle" fill="#E08A6D">misses</text>

    <path d="M1095 152 V184 H1025 V204" fill="none" stroke="#9C9A92" stroke-width="2" marker-end="url(#arrow-muted)"/>
    <path d="M1095 184 H1165 V204" fill="none" stroke="#9C9A92" stroke-width="2" marker-end="url(#arrow-muted)"/>

    <rect x="960" y="210" width="130" height="56" rx="10" fill="#2A2926" stroke="#9C9A92" stroke-width="2"/>
    <text x="1025" y="235" font-size="15" font-weight="600" text-anchor="middle" fill="#F5F4ED">Postgres</text>
    <text x="1025" y="254" font-size="12" text-anchor="middle" fill="#9C9A92">changesets</text>

    <rect x="1100" y="210" width="130" height="56" rx="10" fill="#2A2926" stroke="#9C9A92" stroke-width="2"/>
    <text x="1165" y="235" font-size="15" font-weight="600" text-anchor="middle" fill="#F5F4ED">MinIO</text>
    <text x="1165" y="254" font-size="12" text-anchor="middle" fill="#9C9A92">file contents</text>
  </g>
</svg>
