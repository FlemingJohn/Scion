<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title description">
  <title id="title">Shape of a changeset</title>
  <desc id="description">A changeset row in Postgres holds its id, author, date, message, parent and the files it changed with their blob hashes. A branch points at it. The server derives folder listings and saves them. The blob hashes point at compressed file contents in MinIO.</desc>
  <defs>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#E08A6D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#9C9A92" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1280" height="760" fill="#141413"/>
  <rect x="16" y="16" width="1248" height="728" rx="24" fill="#1F1E1D"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="64" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#F5F4ED">Shape of a changeset</text>
    <text x="64" y="102" font-size="15" fill="#9C9A92">Postgres keeps who, when, why and which files changed. MinIO keeps the bytes, once per hash.</text>

    <rect x="48" y="130" width="1184" height="420" rx="18" fill="#262624" stroke="#3D3D3A" stroke-width="2"/>
    <text x="72" y="162" font-size="15" font-weight="600" fill="#D6D4CB">Supabase Postgres · metadata</text>

    <rect x="72" y="182" width="170" height="48" rx="10" fill="#2A2926" stroke="#9C9A92" stroke-width="2"/>
    <text x="96" y="212" font-size="14" fill="#9C9A92">branch</text>
    <text x="150" y="212" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#F5F4ED">main</text>
    <path d="M242 206 H284" fill="none" stroke="#9C9A92" stroke-width="2" marker-end="url(#arrow-muted)"/>

    <rect x="290" y="186" width="560" height="290" rx="12" fill="#2A2926" stroke="#9C9A92" stroke-width="2"/>
    <path d="M290 226 V198 Q290 186 302 186 H838 Q850 186 850 198 V226 Z" fill="#33322E"/>
    <line x1="290" y1="226" x2="850" y2="226" stroke="#9C9A92" stroke-width="2"/>
    <text x="310" y="212" font-size="15" fill="#D6D4CB">Changeset</text>
    <text x="830" y="212" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" text-anchor="end" fill="#E08A6D">id 9f2c…7ab0</text>

    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">
      <text x="310" y="248" fill="#9C9A92">author</text>
      <text x="450" y="248" fill="#F5F4ED">Ada &lt;ada@example.com&gt;</text>
      <line x1="310" y1="260" x2="830" y2="260" stroke="#3D3D3A"/>
      <text x="310" y="282" fill="#9C9A92">author_date</text>
      <text x="450" y="282" fill="#F5F4ED">2026-10-15T09:25:09Z</text>
      <line x1="310" y1="294" x2="830" y2="294" stroke="#3D3D3A"/>
      <text x="310" y="316" fill="#9C9A92">message</text>
      <text x="450" y="316" fill="#F5F4ED">serve blobs from the cache</text>
      <line x1="310" y1="328" x2="830" y2="328" stroke="#3D3D3A"/>
      <text x="310" y="350" fill="#9C9A92">parent_id</text>
      <text x="450" y="350" fill="#E08A6D">d41c…88e2</text>
      <line x1="310" y1="362" x2="830" y2="362" stroke="#3D3D3A"/>
      <text x="310" y="386" fill="#9C9A92">file_changes</text>
      <text x="450" y="386" fill="#F5F4ED">docs/guide.md</text>
      <text x="600" y="386" fill="#E08A6D">3e1f…a2c4</text>
      <text x="450" y="416" fill="#F5F4ED">src/legacy.ts</text>
      <text x="600" y="416" fill="#D6D4CB">deleted</text>
      <text x="450" y="446" fill="#F5F4ED">tools/build.sh</text>
      <text x="600" y="446" fill="#E08A6D">9b07…5d18</text>
    </g>
    <text x="830" y="386" font-size="13" text-anchor="end" fill="#9C9A92">regular</text>
    <text x="830" y="446" font-size="13" text-anchor="end" fill="#9C9A92">executable</text>

    <path d="M850 345 H894" fill="none" stroke="#9C9A92" stroke-width="2" marker-end="url(#arrow-muted)"/>
    <rect x="900" y="320" width="210" height="50" rx="10" fill="#2A2926" stroke="#9C9A92" stroke-width="2"/>
    <text x="920" y="350" font-size="14" fill="#D6D4CB">Changeset</text>
    <text x="1090" y="350" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" text-anchor="end" fill="#E08A6D">d41c…88e2</text>
    <path d="M1110 345 H1150" fill="none" stroke="#9C9A92" stroke-width="2" marker-end="url(#arrow-muted)"/>
    <text x="1168" y="350" font-size="16" fill="#9C9A92">…</text>
    <text x="900" y="306" font-size="12" fill="#9C9A92">its parent</text>

    <text x="900" y="414" font-size="12" fill="#9C9A92">worked out by the server, saved in trees</text>
    <path d="M850 456 H894" fill="none" stroke="#9C9A92" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
    <rect x="900" y="430" width="150" height="52" rx="10" fill="#2A2926" stroke="#9C9A92" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="918" y="452" font-size="13" fill="#D6D4CB">Root tree</text>
    <text x="918" y="471" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#E08A6D">5c0e…d1a9</text>
    <path d="M1050 456 H1064" fill="none" stroke="#9C9A92" stroke-width="2" marker-end="url(#arrow-muted)"/>
    <rect x="1070" y="430" width="150" height="52" rx="10" fill="#2A2926" stroke="#9C9A92" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="1088" y="452" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#D6D4CB">src/</text>
    <text x="1088" y="471" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#E08A6D">77f0…e9b4</text>

    <rect x="48" y="578" width="1184" height="140" rx="18" fill="#262624" stroke="#3D3D3A" stroke-width="2"/>
    <text x="72" y="612" font-size="15" font-weight="600" fill="#D6D4CB">MinIO · file contents</text>
    <text x="72" y="636" font-size="13" fill="#9C9A92">brotli compressed, never changed,</text>
    <text x="72" y="655" font-size="13" fill="#9C9A92">stored once per SHA-256</text>

    <path d="M605 476 V644" fill="none" stroke="#E08A6D" stroke-width="2" marker-end="url(#arrow-accent)"/>
    <path d="M790 476 V644" fill="none" stroke="#E08A6D" stroke-width="2" marker-end="url(#arrow-accent)"/>
    <path d="M1145 482 V644" fill="none" stroke="#9C9A92" stroke-width="2" marker-end="url(#arrow-muted)"/>
    <text x="1157" y="562" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#9C9A92">app.ts</text>

    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" text-anchor="middle" fill="#E08A6D">
      <rect x="520" y="650" width="170" height="48" rx="10" fill="#2A2926" stroke="#9C9A92" stroke-width="2"/>
      <text x="605" y="679">3e1f…a2c4</text>
      <rect x="705" y="650" width="170" height="48" rx="10" fill="#2A2926" stroke="#9C9A92" stroke-width="2"/>
      <text x="790" y="679">9b07…5d18</text>
      <rect x="1060" y="650" width="170" height="48" rx="10" fill="#2A2926" stroke="#9C9A92" stroke-width="2"/>
      <text x="1145" y="679">c5d2…0e77</text>
    </g>
  </g>
</svg>
