<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title description">
  <title id="title">Scion</title>
  <desc id="description">History lives on the server. Clients fetch only what they need.</desc>
  <defs>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#D97757" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#6B6A63" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1280" height="320" fill="#E8E6DC"/>
  <rect x="16" y="16" width="1248" height="288" rx="24" fill="#FAF9F5"/>

  <text x="72" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" letter-spacing="2.4" fill="#D97757">SOURCE CONTROL FOR AGENTS</text>
  <text x="68" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="84" fill="#141413">Scion</text>
  <text x="72" y="222" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#3D3D3A">History lives on the server.</text>
  <text x="72" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#3D3D3A">Clients fetch only what they need.</text>
  <text x="72" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#73726C">TypeScript · Fastify · Supabase Postgres · MinIO</text>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="895" y="50" font-size="13" text-anchor="middle" fill="#6B6A63">commit · branches · history</text>
    <path d="M695 96 V62 H1095 V92" fill="none" stroke="#6B6A63" stroke-width="2" marker-end="url(#arrow-muted)"/>

    <rect x="620" y="96" width="150" height="56" rx="10" fill="#FFFFFF" stroke="#6B6A63" stroke-width="2"/>
    <text x="695" y="122" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" text-anchor="middle" fill="#141413">scion</text>
    <text x="695" y="141" font-size="12" text-anchor="middle" fill="#73726C">your machine</text>

    <path d="M770 124 H814" fill="none" stroke="#D97757" stroke-width="2" marker-end="url(#arrow-accent)"/>

    <rect x="820" y="96" width="150" height="56" rx="10" fill="#EEF3FA" stroke="#5B8FD0" stroke-width="2"/>
    <text x="895" y="122" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" text-anchor="middle" fill="#141413">scion-cache</text>
    <text x="895" y="141" font-size="12" text-anchor="middle" fill="#73726C">in memory</text>

    <path d="M970 124 H1014" fill="none" stroke="#D97757" stroke-width="2" marker-end="url(#arrow-accent)"/>

    <rect x="1020" y="96" width="150" height="56" rx="10" fill="#EEF3FA" stroke="#5B8FD0" stroke-width="2"/>
    <text x="1095" y="122" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" text-anchor="middle" fill="#141413">scion-server</text>
    <text x="1095" y="141" font-size="12" text-anchor="middle" fill="#73726C">owns history</text>

    <text x="820" y="180" font-size="13" text-anchor="middle" fill="#D97757">trees and blobs</text>
    <text x="992" y="180" font-size="13" text-anchor="middle" fill="#D97757">misses</text>

    <path d="M1095 152 V184 H1025 V204" fill="none" stroke="#6B6A63" stroke-width="2" marker-end="url(#arrow-muted)"/>
    <path d="M1095 184 H1165 V204" fill="none" stroke="#6B6A63" stroke-width="2" marker-end="url(#arrow-muted)"/>

    <rect x="960" y="210" width="130" height="56" rx="10" fill="#FFFFFF" stroke="#6B6A63" stroke-width="2"/>
    <text x="1025" y="235" font-size="15" font-weight="600" text-anchor="middle" fill="#141413">Postgres</text>
    <text x="1025" y="254" font-size="12" text-anchor="middle" fill="#73726C">changesets</text>

    <rect x="1100" y="210" width="130" height="56" rx="10" fill="#FFFFFF" stroke="#6B6A63" stroke-width="2"/>
    <text x="1165" y="235" font-size="15" font-weight="600" text-anchor="middle" fill="#141413">MinIO</text>
    <text x="1165" y="254" font-size="12" text-anchor="middle" fill="#73726C">file contents</text>
  </g>
</svg>
